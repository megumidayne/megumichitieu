<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Megumi Chi Tiêu</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f7fb;
 color:#111827;
}

button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}

.hidden{display:none!important}

.wrap{
 max-width:1100px;
 margin:auto;
 padding:20px;
}

.card{
 background:white;
 border-radius:18px;
 padding:20px;
 margin-bottom:18px;
 box-shadow:0 5px 22px #0000000d;
}

.brand{
 text-align:center;
 padding:25px 10px;
}

.brand h1{
 font-size:34px;
 margin-bottom:8px;
}

.muted{color:#6b7280}

.login{
 max-width:430px;
 margin:7vh auto;
}

.btn{
 width:100%;
 padding:13px 16px;
 border-radius:12px;
 margin-top:10px;
 font-weight:bold;
}

.primary{
 background:#111827;
 color:white;
}

.google{
 background:white;
 border:1px solid #d1d5db;
}

.secondary{
 background:#eef2ff;
 color:#3730a3;
}

.danger{
 background:#fee2e2;
 color:#991b1b;
}

.row{
 display:flex;
 gap:10px;
 flex-wrap:wrap;
}

.row>*{
 flex:1;
 min-width:130px;
}

input,select,textarea{
 width:100%;
 padding:12px;
 border:1px solid #d1d5db;
 border-radius:11px;
 background:white;
}

textarea{
 min-height:100px;
 resize:vertical;
}

label{
 display:block;
 font-weight:bold;
 margin:12px 0 6px;
}

.topbar{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:12px;
 flex-wrap:wrap;
}

.actions{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
}

.smallbtn{
 padding:9px 12px;
 border-radius:10px;
 background:#eef2f7;
}

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:12px;
}

.stat{
 padding:16px;
 border-radius:15px;
 background:#f8fafc;
}

.stat b{
 display:block;
 font-size:22px;
 margin-top:5px;
}

.income{color:#059669}
.expense{color:#dc2626}
.balance{color:#2563eb}

.progress{
 height:10px;
 background:#e5e7eb;
 border-radius:99px;
 overflow:hidden;
}

.progress div{
 height:100%;
 background:#111827;
 width:0;
}

.item{
 display:flex;
 justify-content:space-between;
 gap:12px;
 align-items:center;
 border-bottom:1px solid #eee;
 padding:13px 0;
}

.item:last-child{
 border-bottom:0;
}

.item-info{
 min-width:0;
}

.item-info b{
 display:block;
}

.item-info span{
 font-size:13px;
 color:#6b7280;
}

.amount{
 font-weight:800;
 white-space:nowrap;
}

.modal{
 position:fixed;
 inset:0;
 background:#0008;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:15px;
 z-index:10;
}

.modalbox{
 background:white;
 width:min(600px,100%);
 max-height:90vh;
 overflow:auto;
 border-radius:18px;
 padding:20px;
}

.close{
 float:right;
 background:#f3f4f6;
 border-radius:50%;
 width:35px;
 height:35px;
}

.empty{
 text-align:center;
 color:#6b7280;
 padding:25px;
}

.money-preview{
 font-size:13px;
 color:#2563eb;
 margin-top:5px;
 min-height:18px;
}

.file-name{
 font-size:13px;
 color:#6b7280;
 margin-top:5px;
}

.note-img{
 width:100%;
 max-height:240px;
 object-fit:cover;
 border-radius:12px;
 margin-top:10px;
}

@media(max-width:750px){
 .stats{
  grid-template-columns:repeat(2,1fr);
 }

 .wrap{
  padding:12px;
 }

 .card{
  padding:16px;
 }
}

body.dark{
 background:#111827;
 color:#f9fafb;
}

body.dark .card,
body.dark .modalbox,
body.dark input,
body.dark select,
body.dark textarea{
 background:#1f2937;
 color:#f9fafb;
 border-color:#374151;
}

body.dark .stat{
 background:#273449;
}

body.dark .smallbtn{
 background:#374151;
 color:white;
}

body.dark .muted,
body.dark .item-info span{
 color:#9ca3af;
}

body.dark .progress{
 background:#374151;
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen" class="wrap login">

<div class="card">

<div class="brand">
<h1>💰 Megumi Chi Tiêu</h1>
<p class="muted">Quản lý chi tiêu cá nhân</p>
</div>

<button id="googleBtn" class="btn google">
🔵 Đăng nhập bằng Google
</button>

<div style="text-align:center;margin:15px 0;color:#9ca3af">
hoặc
</div>

<input
 id="email"
 type="email"
 placeholder="Email"
>

<input
 id="password"
 type="password"
 placeholder="Mật khẩu"
 style="margin-top:10px"
>

<button id="emailLoginBtn" class="btn primary">
Đăng nhập
</button>

<button id="registerBtn" class="btn secondary">

<button id="forgotBtn" class="btn" style="background:#f3f4f6">

class="muted"

</div>


<!-- APP -->

<div class="wrap">

<div class="card">

<div class="topbar">

<div>
<h2 style="margin-bottom:5px">
💰 Megumi Chi Tiêu

<div id="userName" class="muted"></div>

<!-- FILTER -->

<div class="row">

<input id="monthFilter" type="month">
</div>

<div>
<label>Tìm kiếm</label>

>

<div>
<label>Loại</label>

<option value="all">

</option>

Thu

<!-- STATS -->

<div class="stats">

<div class="stat">
<span>Thu nhập</span>
<b class="income" id="totalIncome">
0 đ
</b>
</div>

<div class="stat">
<span>Chi tiêu</span>
<b class="expense" id="totalExpense">
0 đ
</b>
</div>

<div class="stat">
<span>Số dư</span>
<b class="balance" id="balance">
0 đ
</b>
</div>

<div class="stat">
<span>Số giao dịch</span>
<b id="count">
0
</b>
</div>

</div>


<!-- ADD TRANSACTION -->

<div class="card" style="margin-top:18px">

<h3>➕ Thêm giao dịch</h3>

<div class="row">

<div>

<label>Loại</label>

<select id="txType">

<option value="expense">
Chi tiêu
</option>

<option value="income">
Thu nhập
</option>

</select>

</div>

<div>

<label>Số tiền</label>

<input
 id="txAmount"
 placeholder="Ví dụ: 50k, 1.5tr, 15.600"
>

<div id="moneyPreview"
class="money-preview">
</div>

</div>

</div>


<div class="row">

<div>

<label>Tên khoản</label>

<input
 id="txName"
 placeholder="Ví dụ: Ăn sáng"
>

</div>

<div>

<label>Danh mục</label>

<select id="txCategory">

<option>Ăn uống</option>
<option>Đi lại</option>
<option>Mua sắm</option>
<option>Học tập</option>
<option>Giải trí</option>
<option>Nhà ở</option>
<option>Sức khỏe</option>

<option>Khác</option>

</select>

</div>

</div>


<label>Ngày</label>

<input id="txDate" type="date">

Thêm giao dịch

<!-- BUDGET -->

<div class="card">

<h3>📊 Ngân sách tháng</h3>

<div class="row">

<input
 id="budgetInput"
 placeholder="Ví dụ: 3tr hoặc 3000000"
>

<button
 id="saveBudgetBtn"

 style="margin-top:0">

class="muted"
style="margin-top:12px">

<div class="progress">

<!-- GOAL -->

<div class="card">

>

 id="saveGoalBtn"

class="muted"

class="modal hidden">

<div class="modalbox">

data-close="settingsModal">

 id="newPin"
 inputmode="numeric"
 maxlength="6"

>

class="btn secondary">

 id="newPassword"

>

class="btn secondary">
Đổi mật khẩu

class="btn"
style="background:#f3f4f6">

<script type="module">

import {
 initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";


import {
 getAuth,
 GoogleAuthProvider,
 signInWithPopup,
 signInWithEmailAndPassword,
 createUserWithEmailAndPassword,
 sendPasswordResetEmail,
 signOut,
 onAuthStateChanged,
 updatePassword
}
from
"https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";


import {
 getFirestore,
 collection,
 addDoc,
 deleteDoc,
 doc,
 getDoc,
 setDoc,
 query,
 orderBy,
 onSnapshot
}
from
"https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";


import {
 getStorage,
 ref,
 uploadBytes,
 getDownloadURL
}
from
"https://www.gstatic.com/firebasejs/12.4.0/firebase-storage.js";


/* FIREBASE */

const firebaseConfig={

apiKey:
"AIzaSyA75Nfy9Ti_z1aWiVk7E4UsmRmgThTVv3Q",

authDomain:
"megumi-chi-tieu.firebaseapp.com",

projectId:
"megumi-chi-tieu",

storageBucket:
"megumi-chi-tieu.firebasestorage.app",

messagingSenderId:
"570579728873",

appId:
"1:570579728873:web:490687c1c7c415061af378",

measurementId:
"G-F6M79HB9K3"

};


const firebaseApp=
initializeApp(firebaseConfig);

const auth=
getAuth(firebaseApp);

const db=
getFirestore(firebaseApp);

const storage=
getStorage(firebaseApp);

const provider=
new GoogleAuthProvider();


let currentUser=null;
let transactions=[];

let unsubscribeTx=null;
let unsubscribeNotes=null;


const $=id=>
document.getElementById(id);


/* MONEY */

function money(n){

return new Intl.NumberFormat("vi-VN")
.format(Math.round(Number(n)||0))
+" đ";

}


function parseMoney(value){

if(
value===null ||
value===undefined
)return 0;

let v=
String(value)
.toLowerCase()
.trim()
.replace(/\s/g,"")
.replace(/đ/g,"");

if(!v)return 0;


/* triệu */

if(v.endsWith("tr")){

const n=
Number(
v.slice(0,-2)
.replace(",",".")
);

return isNaN(n)
?0
:n*1000000;

}


/* nghìn */

if(v.endsWith("k")){

const n=
Number(
v.slice(0,-1)
.replace(",",".")
);

return isNaN(n)
?0
:n*1000;

}


/* số bình thường */

v=
v.replace(/\./g,"")
.replace(/,/g,"");

return Number(v)||0;

}


function today(){

return new Date()
.toISOString()
.slice(0,10);

}


$("txDate").value=today();

$("monthFilter").value=
today().slice(0,7);


/* PREVIEW */

$("txAmount").addEventListener(
"input",
()=>{

const n=
parseMoney(
$("txAmount").value
);

$("moneyPreview").textContent=
n
?"→ "+money(n)
:"";

});


/* GOOGLE LOGIN */

$("googleBtn").onclick=
async()=>{

$("loginMsg").textContent=
"Đang mở đăng nhập Google...";

try{

await signInWithPopup(
auth,
provider
);

}catch(e){

console.error(e);

$("loginMsg").textContent=
friendlyError(e);

}

};


/* EMAIL LOGIN */

$("emailLoginBtn").onclick=
async()=>{

try{

await signInWithEmailAndPassword(
auth,
$("email").value.trim(),
$("password").value
);

}catch(e){

$("loginMsg").textContent=
friendlyError(e);

}

};


/* REGISTER */

$("registerBtn").onclick=
async()=>{

try{

await createUserWithEmailAndPassword(
auth,
$("email").value.trim(),
$("password").value
);

}catch(e){

$("loginMsg").textContent=
friendlyError(e);

}

};


/* FORGOT PASSWORD */

$("forgotBtn").onclick=
async()=>{

const email=
$("email").value.trim();

if(!email){

alert("Nhập email trước.");

return;

}

try{

await sendPasswordResetEmail(
auth,
email
);

alert(
"Đã gửi email đặt lại mật khẩu."
);

}catch(e){

alert(
friendlyError(e)
);

}

};


/* ERRORS */

function friendlyError(e){

const code=e?.code||"";

const map={

"auth/popup-closed-by-user":
"Bạn đã đóng cửa sổ Google.",

"auth/popup-blocked":
"Trình duyệt đã chặn cửa sổ Google. Hãy cho phép popup.",

"auth/unauthorized-domain":
"Tên miền chưa được thêm vào Firebase Authorized domains.",

"auth/invalid-credential":
"Email hoặc mật khẩu không đúng.",

"auth/email-already-in-use":
"Email này đã được đăng ký.",

"auth/weak-password":
"Mật khẩu phải có ít nhất 6 ký tự.",

"auth/invalid-email":
"Email không hợp lệ.",

"auth/network-request-failed":
"Lỗi mạng. Kiểm tra Internet.",

"auth/too-many-requests":
"Có quá nhiều lần thử. Thử lại sau."

};

return map[code]||
(e?.message||"Có lỗi xảy ra.");

}


/* AUTH STATE */

onAuthStateChanged(
auth,
user=>{

currentUser=user;

if(user){

$("loginScreen")
.classList.add("hidden");

$("app")
.classList.remove("hidden");

$("userName").textContent=
user.displayName ||
user.email ||
"Tài khoản";

startRealtime();

loadSettings();

}else{

$("app")
.classList.add("hidden");

$("loginScreen")
.classList.remove("hidden");

if(unsubscribeTx)
unsubscribeTx();

if(unsubscribeNotes)
unsubscribeNotes();

}

});


/* FIRESTORE REFERENCES */

function txRef(){

return collection(
db,
"users",
currentUser.uid,
"transactions"
);

}


function notesRef(){

return collection(
db,
"users",
currentUser.uid,
"notes"
);

}


function userDoc(){

return doc(
db,
"users",
currentUser.uid
);

}


/* REALTIME */

function startRealtime(){

if(unsubscribeTx)
unsubscribeTx();


const q=
query(
txRef(),
orderBy("createdAt","desc")
);


unsubscribeTx=
onSnapshot(
q,
snap=>{

transactions=
snap.docs.map(
d=>({
id:d.id,
...d.data()
})
);

renderTransactions();

updateStats();

},
err=>{

console.error(err);

alert(
"Không tải được giao dịch: "
+err.message
);

});


listenNotes();

}


/* ADD TRANSACTION */

async function addTransaction(){

const amount=
parseMoney(
$("txAmount").value
);

const name=
$("txName").value.trim();


if(amount<=0){

alert("Nhập số tiền hợp lệ.");

return;

}


if(!name){

alert(
"Nhập tên khoản giao dịch."
);

return;

}


try{

await addDoc(
txRef(),
{

type:$("txType").value,

amount,

name,

category:
$("txCategory").value,

date:
$("txDate").value||today(),

createdAt:
new Date()

});


$("txAmount").value="";

$("txName").value="";

$("moneyPreview").textContent="";


}catch(e){

alert(
"Không lưu được: "
+e.message
);

}

}


$("addTxBtn").onclick=
addTransaction;


/* DELETE TRANSACTION */

async function deleteTransaction(id){

if(
!confirm(
"Xóa giao dịch này?"
)
)return;

try{

await deleteDoc(
doc(
db,
"users",
currentUser.uid,
"transactions",
id
)
);

}catch(e){

alert(
"Không xóa được: "
+e.message
);

}

}


/* FILTER */

function filteredTransactions(){

const month=
$("monthFilter").value;

const search=
$("search")
.value
.trim()
.toLowerCase();

const type=
$("typeFilter").value;


return transactions.filter(t=>{

const okMonth=
!month ||
String(t.date||"")
.startsWith(month);

const okSearch=
!search ||
String(t.name||"")
.toLowerCase()
.includes(search);

const okType=
type==="all"||
t.type===type;

return okMonth&&
okSearch&&
okType;

});

}


/* RENDER */

function renderTransactions(){

const list=
$("transactionList");

const arr=
filteredTransactions();


if(!arr.length){

list.innerHTML=
'<div class="empty">Chưa có giao dịch.</div>';

return;

}


list.innerHTML=
arr.map(t=>`

<div class="item">

<div class="item-info">

<b>
${escapeHtml(t.name)}
</b>

<span>
${escapeHtml(t.category||"Khác")}
 ·
${escapeHtml(t.date||"")}
</span>

</div>


<div class="amount
${t.type==="income"
?"income"
:"expense"}">

${t.type==="income"
?"+"
:"-"}${money(t.amount)}

<button
class="smallbtn"
data-delete="${t.id}"
style="margin-left:6px">

🗑️

</button>

</div>

</div>

`).join("");


list
.querySelectorAll(
"[data-delete]"
)
.forEach(btn=>{

btn.onclick=
()=>deleteTransaction(
btn.dataset.delete
);

});

}


function updateStats(){

const arr=
filteredTransactions();

let income=0;
let expense=0;


arr.forEach(t=>{

if(t.type==="income")
income+=
Number(t.amount)||0;

else
expense+=
Number(t.amount)||0;

});


$("totalIncome")
.textContent=
money(income);

$("totalExpense")
.textContent=
money(expense);

$("balance")
.textContent=
money(income-expense);

$("count")
.textContent=
arr.length;


updateBudget(expense);

updateGoal(
income-expense
);

}


$("search").oninput=
renderTransactions;


$("typeFilter").onchange=
renderTransactions;


$("monthFilter").onchange=
()=>{

renderTransactions();

updateStats();

};


/* SETTINGS */

async function getUserSettings(){

const snap=
await getDoc(
userDoc()
);

return snap.exists()
?snap.data()
:{};

}


async function loadSettings(){

try{

const s=
await getUserSettings();

$("budgetInput").value=
s.budget||"";

$("goalInput").value=
s.goal||"";

updateBudget();

updateGoal();

}catch(e){

console.error(e);

}

}


async function saveSetting(
key,
value
){

await setDoc(
userDoc(),
{
[key]:value
},
{
merge:true
}

/* BUDGET DISPLAY */

async function updateBudget(
expenseOverride
){

try{

const s=
await getUserSettings();

const budget=
Number(s.budget)||0;

const arr=
filteredTransactions();

const expense=
expenseOverride!==undefined
?expenseOverride
:arr
.filter(
t=>t.type==="expense"
)
.reduce(
(a,t)=>
a+(Number(t.amount)||0),
0
);


$("budgetText").textContent=
budget
?`Đã chi ${money(expense)} / ${money(budget)}`
:"Chưa đặt ngân sách.";


$("budgetProgress").style.width=
budget
?Math.min(
100,
expense/budget*100
)+"%"
:"0%";


}catch(e){}

}


/* GOAL DISPLAY */

async function updateGoal(
balanceOverride
){

try{

const s=
await getUserSettings();

const goal=
Number(s.goal)||0;

const arr=
filteredTransactions();

const balance=
balanceOverride!==undefined
?balanceOverride
:arr.reduce(
(a,t)=>
a+
(
t.type==="income"
?1
:-1
)*
(Number(t.amount)||0),
0
);


$("goalText").textContent=
goal
?`Đã có ${money(
Math.max(0,balance)
)} / ${money(goal)}`
:"Chưa đặt mục tiêu.";


$("goalProgress").style.width=
goal
?Math.min(
100,
Math.max(0,balance)
/goal*100
)+"%"
:"0%";


}catch(e){}

}


/* CSV */

$("csvBtn").onclick=()=>{

const arr=
filteredTransactions();

if(!arr.length){

alert(
"Không có dữ liệu để xuất."
);

return;

}


const rows=[

[
"Ngày",
"Tên",
"Loại",
"Danh mục",
"Số tiền"
],

...arr.map(t=>[

t.date,

t.name,

t.type==="income"
?"Thu"
:"Chi",

t.category,

t.amount

])

];


const csv=
"\ufeff"+
rows
.map(
r=>
r.map(
v=>
`"${String(v??"")
.replaceAll('"','""')}"`
)
.join(",")
)
.join("\n");


const blob=
new Blob(
[csv],
{
type:
"text/csv;charset=utf-8"
}
);


const url=
URL.createObjectURL(blob);


const a=
document.createElement("a");

a.href=url;

a.download=
"megumi-chi-tieu.csv";

a.click();

URL.revokeObjectURL(url);

};

async function saveNote(){

const title=
$("noteTitle")
.value
.trim();

const content=
$("noteContent")
.value
.trim();

const file=
$("noteImage")
.files[0];


if(
!title &&
!content &&
!file
){

alert(
"Ghi ít nhất một nội dung."
);

return;

}


try{

let imageUrl="";


if(file){

if(
file.size>
10*1024*1024
){

alert(
"Ảnh tối đa 10 MB."
);

return;

}


if(
!file.type
.startsWith("image/")
){

alert(
"Chỉ được chọn file ảnh."
);

return;

}


const safeName=
file.name
.replace(
/[^a-zA-Z0-9._-]/g,
"_"
);


const path=
`users/${currentUser.uid}/notes/${Date.now()}_${safeName}`;


const storageRef=
ref(
storage,
path
);


await uploadBytes(
storageRef,
file,
{
contentType:file.type
}
);


imageUrl=
await getDownloadURL(
storageRef
);

}


await addDoc(
notesRef(),
{

title,

content,

imageUrl,

createdAt:
new Date()

}
);


$("noteTitle").value="";

$("noteContent").value="";

$("noteImage").value="";

$("fileName").textContent="";


alert(
"Đã lưu ghi chú."
);


}catch(e){

console.error(e);

alert(
"Không lưu được ghi chú: "
+e.message
);

}

}


$("saveNoteBtn").onclick=
saveNote;

function listenNotes(){

if(unsubscribeNotes)
unsubscribeNotes();


const q=
query(
notesRef(),
orderBy(

"desc"
)
);


unsubscribeNotes=

q,
snap=>{

if(snap.empty){

$("notesList").innerHTML=

$("notesList").innerHTML=
snap.docs.map(

n.title||

)}

</h3>

${formatTimestamp(
n.createdAt
)}

</div>


<button
class="smallbtn"
data-note-delete="${d.id}">

🗑️

</button>

</div>


<div
style="white-space:pre-wrap">

${escapeHtml(

)}

</div>


${
n.imageUrl

`

}

).join("");

)

},

'<div class="empty">Không tải được ghi chú.</div>';

}

);

}

/* HELPERS */

function formatTimestamp(ts){

if(!ts?.toDate)
return "";

return ts
.toDate()
.toLocaleString(
"vi-VN"
);

}


function escapeHtml(s){

return String(s??"")
.replace(
/[&<>"']/g,
m=>
({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m])
);

}


function escapeAttr(s){

return escapeHtml(s);

}


function simpleHash(s){

let h=2166136261;

for(
let i=0;
i<s.length;
i++
){

h^=
s.charCodeAt(i);

h=
Math.imul(
h,
16777619
);

}

return String(
h>>>0
);

}
