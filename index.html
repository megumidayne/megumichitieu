<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Megumi Chi Tiêu</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f6fa;
  color:#222;
}
body.dark{background:#15171c;color:#eee}
.container{max-width:1100px;margin:auto;padding:20px}
.card{
  background:white;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 5px 20px #0000000d;
}
.dark .card{background:#20232a}
button,input,select{
  font:inherit;
}
button{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  cursor:pointer;
}
.primary{background:#7c5cff;color:white}
.danger{background:#ff5757;color:white}
.gray{background:#e9e9ef}
.dark .gray{background:#333740;color:white}
input,select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  background:white;
  color:#222;
}
.dark input,.dark select{
  background:#2b2f38;
  color:white;
  border-color:#444;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}
.stat{
  padding:18px;
  border-radius:15px;
  background:#f1efff;
}
.dark .stat{background:#2b2f38}
.stat b{display:block;font-size:24px;margin-top:8px}
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.hidden{display:none!important}
.center{text-align:center}
.logo{
  font-size:30px;
  font-weight:bold;
  color:#7c5cff;
}
.transaction{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid #eee;
}
.dark .transaction{border-color:#393d45}
.income{color:#16a34a}
.expense{color:#ef4444}
.small{font-size:13px;color:#777}
.dark .small{color:#aaa}
#pinScreen{
  position:fixed;
  inset:0;
  background:#f5f6fa;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}
.dark #pinScreen{background:#15171c}
.pinBox{
  width:min(400px,90%);
  text-align:center;
}
.pinInput{
  text-align:center;
  font-size:28px;
  letter-spacing:8px;
}
@media(max-width:700px){
  .grid,.stats{grid-template-columns:1fr}
}
</style>
</head>

<body>

<!-- MÀN HÌNH PIN -->
<div id="pinScreen" class="hidden">
  <div class="card pinBox">
    <div class="logo">Megumi Chi Tiêu</div>
    <h2>🔐 Nhập mã PIN</h2>
    <p class="small">Nhập mã PIN để tiếp tục</p>

    <input
      id="pinInput"
      class="pinInput"
      type="password"
      inputmode="numeric"
      maxlength="6"
      placeholder="••••••"
    >

    <br><br>

    <button class="primary" onclick="unlockWithPin()">
      Mở khóa
    </button>

    <button class="gray" onclick="logout()" style="margin-left:5px">
      Đăng xuất
    </button>

    <p id="pinError" class="expense"></p>
  </div>
</div>


<div class="container">

  <!-- LOGIN -->
  <section id="loginPage">
    <div class="card center" style="max-width:450px;margin:60px auto">

      <div class="logo">Megumi Chi Tiêu</div>

      <h2>Đăng nhập</h2>

      <input id="email" type="email" placeholder="Email">
      <br><br>

      <input id="password" type="password" placeholder="Mật khẩu">
      <br><br>

      <button class="primary" style="width:100%" onclick="loginEmail()">
        Đăng nhập
      </button>

      <br><br>

      <button class="gray" style="width:100%" onclick="registerEmail()">
        Tạo tài khoản
      </button>

      <br><br>

      <button class="gray" style="width:100%" onclick="loginGoogle()">
        🔵 Đăng nhập bằng Google
      </button>

      <br>

      <button class="gray" style="width:100%;margin-top:10px"
              onclick="resetPassword()">
        Quên mật khẩu
      </button>

      <p id="loginMessage" class="small"></p>
    </div>
  </section>


  <!-- APP -->
  <section id="app" class="hidden">

    <div class="card">
      <div class="row">
        <div>
          <div class="logo">Megumi Chi Tiêu</div>
          <div class="small" id="userName"></div>
        </div>

        <div class="actions">
          <button class="gray" onclick="toggleDark()">🌙</button>
          <button class="gray" onclick="changePin()">🔐 PIN</button>
          <button class="danger" onclick="logout()">Đăng xuất</button>
        </div>
      </div>
    </div>


    <!-- THỐNG KÊ -->
    <div class="stats">

      <div class="stat">
        <span>Số dư</span>
        <b id="balance">0 đ</b>
      </div>

      <div class="stat">
        <span>Thu nhập</span>
        <b id="income" class="income">0 đ</b>
      </div>

      <div class="stat">
        <span>Chi tiêu</span>
        <b id="expense" class="expense">0 đ</b>
      </div>

    </div>


    <!-- NGÂN SÁCH -->
    <div class="card">

      <h3>💰 Ngân sách tháng</h3>

      <div class="grid">
        <div>
          <label>Ngân sách</label>
          <input id="budget" type="number" placeholder="Ví dụ: 5000000">
        </div>

        <div style="display:flex;align-items:end">
          <button class="primary" onclick="saveBudget()">
            Lưu ngân sách
          </button>
        </div>
      </div>

      <p id="budgetText" class="small"></p>

    </div>


    <!-- THÊM GIAO DỊCH -->
    <div class="card">

      <h3>➕ Thêm giao dịch</h3>

      <div class="grid">

        <div>
          <label>Loại</label>
          <select id="type">
            <option value="expense">Chi tiêu</option>
            <option value="income">Thu nhập</option>
          </select>
        </div>

        <div>
          <label>Số tiền</label>
          <input
            id="amount"
            type="number"
            min="0"
            step="1"
            placeholder="15.600"
          >
        </div>

        <div>
          <label>Danh mục</label>
          <select id="category">
            <option>Ăn uống</option>
            <option>Đi lại</option>
            <option>Mua sắm</option>
            <option>Học tập</option>
            <option>Giải trí</option>
            <option>Hóa đơn</option>
            <option>Lương</option>
            <option>Khác</option>
          </select>
        </div>

        <div>
          <label>Ghi chú</label>
          <input id="note" placeholder="Ví dụ: mua trà sữa">
        </div>

      </div>

      <br>

      <button class="primary" onclick="addTransaction()">
        Thêm giao dịch
      </button>

    </div>


    <!-- TÌM KIẾM -->
    <div class="card">

      <div class="grid">

        <input
          id="search"
          placeholder="🔎 Tìm kiếm..."
          oninput="renderTransactions()"
        >

        <select id="filterType" onchange="renderTransactions()">
          <option value="all">Tất cả</option>
          <option value="income">Thu nhập</option>
          <option value="expense">Chi tiêu</option>
        </select>

      </div>

    </div>


    <!-- DANH SÁCH -->
    <div class="card">

      <div class="row">
        <h3>📋 Giao dịch</h3>

        <button class="gray" onclick="exportCSV()">
          Xuất CSV
        </button>
      </div>

      <div id="transactionList"></div>

    </div>

  </section>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  updateProfile,
  sendPasswordResetEmail,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  getDoc,
  collection,
  addDoc,
  deleteDoc,
  updateDoc,
  query,
  orderBy,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyA75Nfy9Ti_z1aWiVk7E4UsmRmgThTVv3Q",
  authDomain: "megumi-chi-tieu.firebaseapp.com",
  projectId: "megumi-chi-tieu",
  storageBucket: "megumi-chi-tieu.firebasestorage.app",
  messagingSenderId: "570579728873",
  appId: "1:570579728873:web:490687c1c7c415061af378",
  measurementId: "G-F6M79HB9K3"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const provider = new GoogleAuthProvider();

let currentUser = null;
let transactions = [];
let unsubscribeTransactions = null;


/* =========================
   TIỆN ÍCH
========================= */

function money(value){
  return new Intl.NumberFormat("vi-VN").format(Number(value || 0)) + " đ";
}

function show(id){
  document.getElementById(id).classList.remove("hidden");
}

function hide(id){
  document.getElementById(id).classList.add("hidden");
}


/* =========================
   HASH PIN
========================= */

async function hashPin(pin){

  const data = new TextEncoder().encode(pin);

  const hash = await crypto.subtle.digest(
    "SHA-256",
    data
  );

  return Array.from(
    new Uint8Array(hash)
  )
  .map(b => b.toString(16).padStart(2,"0"))
  .join("");
}


/* =========================
   TẠO PIN
========================= */

async function setupPin(){

  let pin = prompt(
    "Tạo mã PIN 6 số cho thiết bị này:"
  );

  if(!pin) return;

  if(!/^\d{6}$/.test(pin)){
    alert("PIN phải gồm đúng 6 số.");
    return setupPin();
  }

  let confirmPin = prompt(
    "Nhập lại mã PIN:"
  );

  if(pin !== confirmPin){
    alert("PIN không trùng nhau.");
    return setupPin();
  }

  const hash = await hashPin(pin);

  localStorage.setItem(
    "megumi_pin_" + currentUser.uid,
    hash
  );

  localStorage.setItem(
    "megumi_pin_enabled_" + currentUser.uid,
    "true"
  );

  alert("Đã tạo mã PIN.");
}


/* =========================
   KIỂM TRA PIN
========================= */

async function checkPin(){

  const key =
    "megumi_pin_" + currentUser.uid;

  const savedPin =
    localStorage.getItem(key);

  if(!savedPin){

    await setupPin();

    return true;
  }

  return false;
}


/* =========================
   MỞ KHÓA
========================= */

window.unlockWithPin = async function(){

  const input =
    document.getElementById("pinInput");

  const error =
    document.getElementById("pinError");

  const pin = input.value;

  if(!/^\d{6}$/.test(pin)){

    error.textContent =
      "PIN phải gồm 6 số.";

    return;
  }

  const hash =
    await hashPin(pin);

  const saved =
    localStorage.getItem(
      "megumi_pin_" + currentUser.uid
    );

  if(hash === saved){

    input.value = "";
    error.textContent = "";

    hide("pinScreen");
    show("app");

    loadUserData();

  }else{

    error.textContent =
      "PIN không đúng.";

    input.value = "";
  }
};


/* =========================
   ĐỔI PIN
========================= */

window.changePin = async function(){

  const oldPin = prompt(
    "Nhập PIN hiện tại:"
  );

  if(!oldPin) return;

  const oldHash =
    await hashPin(oldPin);

  const saved =
    localStorage.getItem(
      "megumi_pin_" + currentUser.uid
    );

  if(oldHash !== saved){

    alert("PIN hiện tại không đúng.");
    return;
  }

  let newPin = prompt(
    "Nhập PIN mới gồm 6 số:"
  );

  if(!/^\d{6}$/.test(newPin)){

    alert("PIN phải gồm đúng 6 số.");
    return;
  }

  let confirmPin = prompt(
    "Nhập lại PIN mới:"
  );

  if(newPin !== confirmPin){

    alert("PIN không trùng nhau.");
    return;
  }

  const newHash =
    await hashPin(newPin);

  localStorage.setItem(
    "megumi_pin_" + currentUser.uid,
    newHash
  );

  alert("Đã đổi PIN.");
};


/* =========================
   GOOGLE LOGIN
========================= */

window.loginGoogle = async function(){

  try{

    await signInWithPopup(
      auth,
      provider
    );

  }catch(error){

    document.getElementById(
      "loginMessage"
    ).textContent =
      error.message;
  }
};


/* =========================
   EMAIL LOGIN
========================= */

window.loginEmail = async function(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if(!email || !password){

    alert("Nhập email và mật khẩu.");
    return;
  }

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(error){

    alert(error.message);
  }
};


/* =========================
   ĐĂNG KÝ
========================= */

window.registerEmail = async function(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if(!email || !password){

    alert("Nhập email và mật khẩu.");
    return;
  }

  if(password.length < 6){

    alert("Mật khẩu phải có ít nhất 6 ký tự.");
    return;
  }

  try{

    const result =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

    await updateProfile(
      result.user,
      {
        displayName:
          email.split("@")[0]
      }
    );

    await setDoc(
      doc(
        db,
        "users",
        result.user.uid
      ),
      {
        email: email,
        name: email.split("@")[0],
        budget: 0
      },
      {merge:true}
    );

    alert("Tạo tài khoản thành công.");

  }catch(error){

    alert(error.message);
  }
};


/* =========================
   QUÊN MẬT KHẨU
========================= */

window.resetPassword = async function(){

  const email =
    document.getElementById("email").value.trim();

  if(!email){

    alert("Nhập email trước.");
    return;
  }

  try{

    await sendPasswordResetEmail(
      auth,
      email
    );

    alert(
      "Đã gửi email đặt lại mật khẩu."
    );

  }catch(error){

    alert(error.message);
  }
};


/* =========================
   AUTH
========================= */

onAuthStateChanged(
  auth,
  async user => {

    currentUser = user;

    if(!user){

      show("loginPage");
      hide("app");
      hide("pinScreen");

      if(unsubscribeTransactions){
        unsubscribeTransactions();
        unsubscribeTransactions = null;
      }

      return;
    }

    hide("loginPage");

    const pinKey =
      "megumi_pin_" + user.uid;

    const hasPin =
      localStorage.getItem(pinKey);

    if(!hasPin){

      show("app");

      document.getElementById(
        "userName"
      ).textContent =
        user.displayName ||
        user.email;

      loadUserData();

      setTimeout(
        async () => {
          await setupPin();
        },
        500
      );

    }else{

      hide("app");
      show("pinScreen");

      document.getElementById(
        "pinInput"
      ).focus();
    }
  }
);


/* =========================
   LOAD USER
========================= */

async function loadUserData(){

  if(!currentUser) return;

  document.getElementById(
    "userName"
  ).textContent =
    currentUser.displayName ||
    currentUser.email;

  const userRef =
    doc(
      db,
      "users",
      currentUser.uid
    );

  const snap =
    await getDoc(userRef);

  if(snap.exists()){

    const data = snap.data();

    document.getElementById(
      "budget"
    ).value =
      data.budget || 0;
  }

  listenTransactions();
}


/* =========================
   FIRESTORE TRANSACTIONS
========================= */

function listenTransactions(){

  if(unsubscribeTransactions)
    unsubscribeTransactions();

  const ref =
    collection(
      db,
      "users",
      currentUser.uid,
      "transactions"
    );

  const q =
    query(
      ref,
      orderBy("createdAt","desc")
    );

  unsubscribeTransactions =
    onSnapshot(
      q,
      snapshot => {

        transactions =
          snapshot.docs.map(
            d => ({
              id:d.id,
              ...d.data()
            })
          );

        renderTransactions();
        updateStats();

      },
      error => {

        console.error(error);

        alert(
          "Không thể tải dữ liệu. Hãy kiểm tra Firestore."
        );
      }
    );
}


/* =========================
   THÊM GIAO DỊCH
========================= */

window.addTransaction = async function(){

  if(!currentUser) return;

  const type =
    document.getElementById("type").value;

  const amount =
    Number(
      document.getElementById("amount").value
    );

  const category =
    document.getElementById("category").value;

  const note =
    document.getElementById("note").value.trim();

  if(!amount || amount <= 0){

    alert("Nhập số tiền hợp lệ.");
    return;
  }

  try{

    await addDoc(
      collection(
        db,
        "users",
        currentUser.uid,
        "transactions"
      ),
      {
        type,
        amount,
        category,
        note,
        createdAt: Date.now()
      }
    );

    document.getElementById(
      "amount"
    ).value = "";

    document.getElementById(
      "note"
    ).value = "";

  }catch(error){

    alert(error.message);
  }
};


/* =========================
   XÓA GIAO DỊCH
========================= */

window.deleteTransaction = async function(id){

  if(!confirm("Xóa giao dịch này?"))
    return;

  await deleteDoc(
    doc(
      db,
      "users",
      currentUser.uid,
      "transactions",
      id
    )
  );
};


/* =========================
   HIỂN THỊ
========================= */

window.renderTransactions = function(){

  const list =
    document.getElementById(
      "transactionList"
    );

  const search =
    document.getElementById(
      "search"
    ).value.toLowerCase();

  const filter =
    document.getElementById(
      "filterType"
    ).value;

  const filtered =
    transactions.filter(t => {

      const text =
        (
          t.category +
          " " +
          (t.note || "")
        ).toLowerCase();

      const matchSearch =
        text.includes(search);

      const matchType =
        filter === "all" ||
        t.type === filter;

      return matchSearch && matchType;
    });

  if(filtered.length === 0){

    list.innerHTML =
      '<p class="small">Chưa có giao dịch.</p>';

    return;
  }

  list.innerHTML =
    filtered.map(t => {

      const date =
        new Date(
          t.createdAt
        ).toLocaleString(
          "vi-VN"
        );

      const sign =
        t.type === "income"
          ? "+"
          : "-";

      return `
        <div class="transaction">

          <div>
            <b>${escapeHTML(t.category)}</b>

            <div class="small">
              ${escapeHTML(t.note || "")}
            </div>

            <div class="small">
              ${date}
            </div>
          </div>

          <div style="text-align:right">

            <b class="${t.type}">
              ${sign}${money(t.amount)}
            </b>

            <br>

            <button
              class="danger"
              onclick="deleteTransaction('${t.id}')">
              Xóa
            </button>

          </div>

        </div>
      `;

    }).join("");
};


/* =========================
   THỐNG KÊ
========================= */

function updateStats(){

  let income = 0;
  let expense = 0;

  transactions.forEach(t => {

    if(t.type === "income")
      income += Number(t.amount);

    else
      expense += Number(t.amount);
  });

  const balance =
    income - expense;

  document.getElementById(
    "income"
  ).textContent =
    money(income);

  document.getElementById(
    "expense"
  ).textContent =
    money(expense);

  document.getElementById(
    "balance"
  ).textContent =
    money(balance);

  updateBudget(expense);
}


/* =========================
   NGÂN SÁCH
========================= */

window.saveBudget = async function(){

  const budget =
    Number(
      document.getElementById(
        "budget"
      ).value
    );

  await setDoc(
    doc(
      db,
      "users",
      currentUser.uid
    ),
    {
      budget
    },
    {merge:true}
  );

  updateBudget(
    transactions
      .filter(t => t.type === "expense")
      .reduce(
        (a,b) => a + Number(b.amount),
        0
      )
  );

  alert("Đã lưu ngân sách.");
};


function updateBudget(expense){

  const budget =
    Number(
      document.getElementById(
        "budget"
      ).value || 0
    );

  if(!budget){

    document.getElementById(
      "budgetText"
    ).textContent =
      "Chưa đặt ngân sách.";

    return;
  }

  const remain =
    budget - expense;

  document.getElementById(
    "budgetText"
  ).textContent =
    remain >= 0
      ? `Còn lại: ${money(remain)}`
      : `Đã vượt: ${money(Math.abs(remain))}`;
}


/* =========================
   CSV
========================= */

window.exportCSV = function(){

  if(!transactions.length){

    alert("Chưa có dữ liệu.");
    return;
  }

  let csv =
    "Loại,Danh mục,Số tiền,Ghi chú,Ngày\n";

  transactions.forEach(t => {

    csv +=
      `"${t.type}",` +
      `"${t.category}",` +
      `"${t.amount}",` +
      `"${(t.note || "").replaceAll('"','""')}",` +
      `"${new Date(t.createdAt).toLocaleString("vi-VN")}"\n`;
  });

  const blob =
    new Blob(
      ["\ufeff" + csv],
      {type:"text/csv;charset=utf-8;"}
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;
  a.download = "megumi-chi-tieu.csv";
  a.click();

  URL.revokeObjectURL(url);
};


/* =========================
   DARK MODE
========================= */

window.toggleDark = function(){

  document.body.classList.toggle(
    "dark"
  );

  localStorage.setItem(
    "megumi_dark",
    document.body.classList.contains("dark")
      ? "1"
      : "0"
  );
};

if(
  localStorage.getItem(
    "megumi_dark"
  ) === "1"
){
  document.body.classList.add("dark");
}

/* =========================
   BẢO VỆ HTML
========================= */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
