<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Megumi Chi Tiêu</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f6f7fb;
    color: #333;
}

header {
    background: linear-gradient(135deg, #ff70a3, #ff9abb);
    color: white;
    text-align: center;
    padding: 28px 15px;
}

header h1 {
    font-size: 30px;
    margin-bottom: 8px;
}

header p {
    opacity: 0.9;
}

.container {
    max-width: 950px;
    margin: 25px auto;
    padding: 0 15px;
}

.summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.07);
    margin-bottom: 20px;
}

.summary .card {
    text-align: center;
}

.summary h3 {
    font-size: 15px;
    color: #777;
    margin-bottom: 10px;
}

.amount {
    font-size: 22px;
    font-weight: bold;
}

.income {
    color: #16a36a;
}

.expense {
    color: #ef5575;
}

.balance {
    color: #755bd8;
}

input,
select,
button {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border-radius: 10px;
    font-size: 16px;
}

input,
select {
    border: 1px solid #ddd;
    background: white;
    outline: none;
}

input:focus,
select:focus {
    border-color: #ff70a3;
}

button {
    border: none;
    background: #ff70a3;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #ff4f8c;
}

/* ĐĂNG NHẬP */
.login-box {
    max-width: 500px;
    margin: 20px auto;
    text-align: center;
}

#userInfo {
    display: none;
}

.google-btn {
    background: white;
    color: #333;
    border: 1px solid #ddd;
}

.google-btn:hover {
    background: #f5f5f5;
}

.logout-btn {
    background: #777;
}

.logout-btn:hover {
    background: #555;
}

.user-email {
    margin-top: 10px;
    color: #777;
    font-size: 14px;
}

.search {
    margin-bottom: 20px;
}

.transaction {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    padding: 15px 0;
    border-bottom: 1px solid #eee;
}

.transaction:last-child {
    border-bottom: none;
}

.transaction-name {
    font-weight: bold;
    margin-bottom: 5px;
}

.transaction-category {
    color: #888;
    font-size: 13px;
}

.transaction-right {
    text-align: right;
    white-space: nowrap;
}

.delete {
    width: auto;
    padding: 7px 12px;
    margin-top: 7px;
    background: #ff5757;
    font-size: 13px;
}

.empty {
    text-align: center;
    color: #999;
    padding: 25px;
}

@media (max-width: 650px) {

    .summary {
        grid-template-columns: 1fr;
    }

    header h1 {
        font-size: 25px;
    }

    .transaction {
        align-items: flex-start;
    }
}
</style>
</head>

<body>

<header>
    <h1>🌸 Megumi Chi Tiêu</h1>
    <p>Quản lý chi tiêu cá nhân</p>
</header>

<div class="container">

    <!-- ĐĂNG NHẬP -->
    <div class="card login-box">

        <div id="loginArea">

            <h2>🔐 Đăng nhập</h2>

            <p style="margin-top:10px;color:#777;">
                Đăng nhập để sử dụng Megumi Chi Tiêu
            </p>

            <button
                class="google-btn"
                id="googleLoginBtn"
            >
                🔵 Đăng nhập bằng Google
            </button>

        </div>

        <div id="userInfo">

            <h2>👋 Xin chào!</h2>

            <div
                id="userEmail"
                class="user-email"
            ></div>

            <button
                class="logout-btn"
                id="logoutBtn"
            >
                Đăng xuất
            </button>

        </div>

    </div>


    <!-- THỐNG KÊ -->
    <div class="summary">

        <div class="card">

            <h3>💰 Tổng thu</h3>

            <div
                id="totalIncome"
                class="amount income"
            >
                0 ₫
            </div>

        </div>


        <div class="card">

            <h3>💸 Tổng chi</h3>

            <div
                id="totalExpense"
                class="amount expense"
            >
                0 ₫
            </div>

        </div>


        <div class="card">

            <h3>💵 Số dư</h3>

            <div
                id="balance"
                class="amount balance"
            >
                0 ₫
            </div>

        </div>

    </div>


    <!-- THÊM GIAO DỊCH -->
    <div class="card">

        <h2>➕ Thêm giao dịch</h2>

        <input
            type="text"
            id="name"
            placeholder="Tên giao dịch, VD: Ăn sáng"
        >

        <input
            type="number"
            id="money"
            placeholder="Số tiền, VD: 15600"
            min="0"
        >

        <select id="type">

            <option value="expense">
                💸 Khoản chi
            </option>

            <option value="income">
                💰 Khoản thu
            </option>

        </select>


        <select id="category">

            <option>🍜 Ăn uống</option>
            <option>🚗 Đi lại</option>
            <option>🛍️ Mua sắm</option>
            <option>📚 Học tập</option>
            <option>🏠 Nhà ở</option>
            <option>🎮 Giải trí</option>
            <option>💼 Công việc</option>
            <option>📦 Khác</option>

        </select>


        <button onclick="addTransaction()">
            Thêm giao dịch
        </button>

    </div>


    <!-- TÌM KIẾM -->
    <div class="card">

        <h2>🔎 Tìm kiếm</h2>

        <input
            type="text"
            id="search"
            placeholder="Tìm giao dịch..."
            oninput="displayTransactions()"
        >

    </div>


    <!-- LỊCH SỬ -->
    <div class="card">

        <h2>📋 Lịch sử giao dịch</h2>

        <div id="transactionList"></div>

    </div>

</div>


<!-- FIREBASE -->
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

    apiKey: "AIzaSyA75Nfy9Ti_z1aWiVk7E4UsRmgThTVv3Q",

    authDomain:
        "megumi-chi-tieu.firebaseapp.com",

    projectId:
        "megumi-chi-tieu",

    storageBucket:
        "megumi-chi-tieu.firebasestorage.app",

    messagingSenderId:
        "570579728873",

    appId:
        "1:570579728873:web:490687c1c7c415061af378",

    measurementId:
        "G-F6M79HB9K3"
};


/* KHỞI TẠO FIREBASE */

const app =
    initializeApp(firebaseConfig);


/* AUTHENTICATION */

const auth =
    getAuth(app);


const provider =
    new GoogleAuthProvider();


/* NÚT GOOGLE */

document
    .getElementById("googleLoginBtn")
    .addEventListener(
        "click",
        async () => {

            try {

                await signInWithPopup(
                    auth,
                    provider
                );

            } catch (error) {

                console.error(error);

                alert(
                    "Đăng nhập Google không thành công!"
                );

            }

        }
    );


/* ĐĂNG XUẤT */

document
    .getElementById("logoutBtn")
    .addEventListener(
        "click",
        async () => {

            try {

                await signOut(auth);

            } catch (error) {

                console.error(error);

            }

        }
    );


/* KIỂM TRA TRẠNG THÁI ĐĂNG NHẬP */

onAuthStateChanged(
    auth,
    (user) => {

        const loginArea =
            document.getElementById(
                "loginArea"
            );

        const userInfo =
            document.getElementById(
                "userInfo"
            );

        const userEmail =
            document.getElementById(
                "userEmail"
            );


        if (user) {

            loginArea.style.display =
                "none";

            userInfo.style.display =
                "block";

            userEmail.textContent =
                user.email;

        } else {

            loginArea.style.display =
                "block";

            userInfo.style.display =
                "none";

        }

    }
);


/* ========================= */
/* CHI TIÊU */
/* ========================= */


let transactions =
    JSON.parse(
        localStorage.getItem(
            "megumiTransactions"
        )
    ) || [];


/* ĐỊNH DẠNG TIỀN */

function formatMoney(number) {

    return Number(number)
        .toLocaleString("vi-VN")
        + " ₫";

}


/* LƯU */

function saveData() {

    localStorage.setItem(
        "megumiTransactions",
        JSON.stringify(
            transactions
        )
    );

}


/* THÊM GIAO DỊCH */

window.addTransaction =
function () {

    const name =
        document
        .getElementById("name")
        .value
        .trim();


    const money =
        Number(
            document
            .getElementById("money")
            .value
        );


    const type =
        document
        .getElementById("type")
        .value;


    const category =
        document
        .getElementById("category")
        .value;


    if (
        name === ""
        ||
        money <= 0
    ) {

        alert(
            "Vui lòng nhập tên giao dịch và số tiền!"
        );

        return;

    }


    transactions.push({

        id: Date.now(),

        name: name,

        money: money,

        type: type,

        category: category

    });


    saveData();


    document
        .getElementById("name")
        .value = "";


    document
        .getElementById("money")
        .value = "";


    displayTransactions();

};


/* XÓA */

window.deleteTransaction =
function (id) {

    transactions =
        transactions.filter(
            item =>
                item.id !== id
        );


    saveData();

    displayTransactions();

};


/* HIỂN THỊ */

window.displayTransactions =
function () {

    const list =
        document.getElementById(
            "transactionList"
        );


    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase();


    list.innerHTML = "";


    let totalIncome = 0;

    let totalExpense = 0;


    const filtered =
        transactions.filter(
            item =>

                item.name
                    .toLowerCase()
                    .includes(search)

                ||

                item.category
                    .toLowerCase()
                    .includes(search)
        );


    if (
        filtered.length === 0
    ) {

        list.innerHTML =
            '<div class="empty">Chưa có giao dịch.</div>';

    }


    filtered.forEach(
        item => {

            if (
                item.type === "income"
            ) {

                totalIncome +=
                    item.money;

            } else {

                totalExpense +=
                    item.money;

            }


            const transaction =
                document.createElement(
                    "div"
                );


            transaction.className =
                "transaction";


            const sign =
                item.type === "income"
                ? "+"
                : "-";


            const color =
                item.type === "income"
                ? "#16a36a"
                : "#ef5575";


            transaction.innerHTML = `

                <div>

                    <div class="transaction-name">
                        ${item.name}
                    </div>

                    <div class="transaction-category">
                        ${item.category}
                    </div>

                </div>


                <div class="transaction-right">

                    <strong
                        style="color:${color}"
                    >
                        ${sign}${formatMoney(item.money)}
                    </strong>

                    <br>

                    <button
                        class="delete"
                        onclick="deleteTransaction(${item.id})"
                    >
                        Xóa
                    </button>

                </div>

            `;


            list.appendChild(
                transaction
            );

        }
    );


    const balance =
        totalIncome
        -
        totalExpense;


    document
        .getElementById(
            "totalIncome"
        )
        .textContent =
        formatMoney(
            totalIncome
        );


    document
        .getElementById(
            "totalExpense"
        )
        .textContent =
        formatMoney(
            totalExpense
        );


    document
        .getElementById(
            "balance"
        )
        .textContent =
        formatMoney(
            balance
        );

};


/* CHẠY */

displayTransactions();

</script>

</body>
</html>
