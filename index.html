<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Megumi Chi Tiêu</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#f6f7fb;
color:#222
}
body.dark{background:#15171c;color:#eee}
.container{max-width:1100px;margin:auto;padding:20px}
.card{
background:white;
border-radius:18px;
padding:20px;
margin-bottom:18px;
box-shadow:0 5px 20px #0001
}
.dark .card{background:#20232a}
.logo{font-size:30px;font-weight:bold;color:#7657ff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{padding:18px;border-radius:15px;background:#f0edff}
.dark .stat{background:#2b2f38}
.stat b{display:block;font-size:23px;margin-top:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button,input,select{font:inherit}
button{
border:0;border-radius:10px;padding:11px 15px;cursor:pointer
}
.primary{background:#7657ff;color:white}
.danger{background:#ff5757;color:white}
.gray{background:#e9e9ef}
.dark .gray{background:#343842;color:white}
input,select{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:10px;
background:white;
color:#222
}
.dark input,.dark select{
background:#2b2f38;
color:white;
border-color:#444
}
.small{font-size:13px;color:#777}
.dark .small{color:#aaa}
.income{color:#16a34a}
.expense{color:#ef4444}
.transaction{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px 0;
border-bottom:1px solid #eee
}
.dark .transaction{border-color:#393d45}
.center{text-align:center}
.hidden{display:none!important}

#pinScreen{
position:fixed;
inset:0;
background:#f6f7fb;
display:flex;
justify-content:center;
align-items:center;
z-index:9999
}
.dark #pinScreen{background:#15171c}
.pinBox{
width:min(400px,90%);
text-align:center
}
.pinInput{
text-align:center;
font-size:28px;
letter-spacing:8px
}

@media(max-width:700px){
.grid,.stats{grid-template-columns:1fr}
}
</style>
</head>

<body>

<!-- PIN -->
<div id="pinScreen" class="hidden">
<div class="card pinBox">

<div class="logo">Megumi Chi Tiêu</div>

<h2>🔐 Nhập mã PIN</h2>
<p class="small">Nhập PIN 6 số để tiếp tục</p>

<input
id="pinInput"
class="pinInput"
type="password"
inputmode="numeric"
maxlength="6"
placeholder="••••••"
>

<br><br>

<button class="primary" onclick="unlockPin()">
Mở khóa
</button>

<button class="gray" onclick="logout()">
Đăng xuất
</button>

<p id="pinError" class="expense"></p>

</div>
</div>


<div class="container">

<!-- LOGIN -->
<div id="loginPage">

<div class="card center" style="max-width:430px;margin:60px auto">

<div class="logo">Megumi Chi Tiêu</div>

<h2>Đăng nhập</h2>

<input id="email" type="email" placeholder="Email">

<br><br>

<input id="password" type="password" placeholder="Mật khẩu">

<br><br>

<button class="primary" style="width:100%" onclick="loginEmail()">
Đăng nhập
</button>

<br><br>

<button class="gray" style="width:100%" onclick="registerEmail()">
Tạo tài khoản
</button>

<br><br>

<button class="gray" style="width:100%" onclick="loginGoogle()">
🔵 Đăng nhập bằng Google
</button>

<br><br>

<button class="gray" style="width:100%" onclick="resetPassword()">
Quên mật khẩu
</button>

<p id="loginMessage" class="small"></p>

</div>
</div>


<!-- APP -->
<div id="app" class="hidden">

<div class="card">

<div class="row">

<div>
<div class="logo">Megumi Chi Tiêu</div>
<div id="userName" class="small"></div>
</div>

<div class="actions">

<button class="gray" onclick="toggleDark()">🌙</button>

<button class="gray" onclick="changePin()">🔐 PIN</button>

<button class="danger" onclick="logout()">
Đăng xuất
</button>

</div>
</div>
</div>


<!-- STATS -->
<div class="stats">

<div class="stat">
Số dư
<b id="balance">0 đ</b>
</div>

<div class="stat">
Thu nhập
<b id="income" class="income">0 đ</b>
</div>

<div class="stat">
Chi tiêu
<b id="expense" class="expense">0 đ</b>
</div>

</div>


<!-- BUDGET -->
<div class="card">

<h3>💰 Ngân sách tháng</h3>

<div class="grid">

<div>
<label>Ngân sách</label>
<input
id="budget"
type="number"
min="0"
step="1"
placeholder="5000000"
>
</div>

<div style="display:flex;align-items:end">

<button class="primary" onclick="saveBudget()">
Lưu ngân sách
</button>

</div>

</div>

<p id="budgetText" class="small"></p>

</div>


<!-- ADD -->
<div class="card">

<h3>➕ Thêm giao dịch</h3>

<div class="grid">

<div>
<label>Loại</label>

<select id="type">
<option value="expense">Chi tiêu</option>
<option value="income">Thu nhập</option>
</select>

</div>

<div>
<label>Số tiền</label>

<input
id="amount"
type="number"
min="0"
step="1"
placeholder="15600"
>

</div>

<div>
<label>Danh mục</label>

<select id="category">

<option>Ăn uống</option>
<option>Đi lại</option>
<option>Mua sắm</option>
<option>Học tập</option>
<option>Giải trí</option>
<option>Hóa đơn</option>
<option>Lương</option>
<option>Khác</option>

</select>

</div>

<div>
<label>Ghi chú</label>

<input
id="note"
placeholder="Ví dụ: mua trà sữa"
>

</div>

</div>

<br>

<button class="primary" onclick="addTransaction()">
Thêm giao dịch
</button>

</div>


<!-- SEARCH -->
<div class="card">

<div class="grid">

<input
id="search"
placeholder="🔎 Tìm kiếm..."
oninput="renderTransactions()"
>

<select id="filterType" onchange="renderTransactions()">

<option value="all">Tất cả</option>
<option value="income">Thu nhập</option>
<option value="expense">Chi tiêu</option>

</select>

</div>

</div>


<!-- LIST -->
<div class="card">

<div class="row">

<h3>📋 Giao dịch</h3>

<button class="gray" onclick="exportCSV()">
Xuất CSV
</button>

</div>

<div id="transactionList"></div>

</div>

</div>

</div>


<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
signInWithEmailAndPassword,
createUserWithEmailAndPassword,
updateProfile,
sendPasswordResetEmail,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
getFirestore,
doc,
setDoc,
getDoc,
collection,
addDoc,
deleteDoc,
query,
orderBy,
onSnapshot
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const firebaseConfig={
apiKey:"AIzaSyA75Nfy9Ti_z1aWiVk7E4UsmRmgThTVv3Q",
authDomain:"megumi-chi-tieu.firebaseapp.com",
projectId:"megumi-chi-tieu",
storageBucket:"megumi-chi-tieu.firebasestorage.app",
messagingSenderId:"570579728873",
appId:"1:570579728873:web:490687c1c7c415061af378",
measurementId:"G-F6M79HB9K3"
};


const app=initializeApp(firebaseConfig);

const auth=getAuth(app);
const db=getFirestore(app);

const provider=new GoogleAuthProvider();

let currentUser=null;
let transactions=[];
let unsubscribe=null;


/* =====================
   UTILITY
===================== */

function money(n){

return new Intl.NumberFormat("vi-VN")
.format(Number(n||0))+" đ";

}


function escapeHTML(v){

return String(v||"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =====================
   PIN HASH
===================== */

async function hashPin(pin){

const data=
new TextEncoder().encode(pin);

const hash=
await crypto.subtle.digest(
"SHA-256",
data
);

return Array.from(
new Uint8Array(hash)
)
.map(x=>x.toString(16).padStart(2,"0"))
.join("");

}


/* =====================
   CREATE PIN
===================== */

async function createPin(){

let pin=prompt(
"Tạo mã PIN 6 số:"
);

if(!pin)return false;

if(!/^\d{6}$/.test(pin)){

alert("PIN phải đúng 6 số.");

return createPin();

}

let again=prompt(
"Nhập lại mã PIN:"
);

if(pin!==again){

alert("PIN không trùng.");

return createPin();

}

const hash=await hashPin(pin);

localStorage.setItem(
"megumi_pin_"+currentUser.uid,
hash
);

return true;

}


/* =====================
   UNLOCK
===================== */

window.unlockPin=async function(){

const pin=
document.getElementById("pinInput").value;

if(!/^\d{6}$/.test(pin)){

document.getElementById("pinError")
.textContent="Nhập đủ 6 số.";

return;

}

const hash=await hashPin(pin);

const saved=
localStorage.getItem(
"megumi_pin_"+currentUser.uid
);

if(hash!==saved){

document.getElementById("pinError")
.textContent="PIN không đúng.";

return;

}

document.getElementById("pinInput").value="";
document.getElementById("pinError").textContent="";

document.getElementById("pinScreen")
.classList.add("hidden");

document.getElementById("app")
.classList.remove("hidden");

loadData();

};


/* =====================
   CHANGE PIN
===================== */

window.changePin=async function(){

const old=prompt("PIN hiện tại:");

if(!old)return;

const oldHash=await hashPin(old);

const saved=
localStorage.getItem(
"megumi_pin_"+currentUser.uid
);

if(oldHash!==saved){

alert("PIN hiện tại không đúng.");

return;

}

const newPin=prompt("PIN mới 6 số:");

if(!/^\d{6}$/.test(newPin)){

alert("PIN phải đúng 6 số.");

return;

}

const again=prompt("Nhập lại PIN mới:");

if(newPin!==again){

alert("PIN không trùng.");

return;

}

localStorage.setItem(
"megumi_pin_"+currentUser.uid,
await hashPin(newPin)
);

alert("Đã đổi PIN.");

};


/* =====================
   GOOGLE
===================== */

window.loginGoogle=async function(){

try{

await signInWithPopup(
auth,
provider
);

}catch(e){

alert(e.message);

}

};


/* =====================
   EMAIL LOGIN
===================== */

window.loginEmail=async function(){

const email=
document.getElementById("email")
.value.trim();

const password=
document.getElementById("password")
.value;

if(!email||!password){

alert("Nhập email và mật khẩu.");

return;

}

try{

await signInWithEmailAndPassword(
auth,
email,
password
);

}catch(e){

alert(e.message);

}

};


/* =====================
   REGISTER
===================== */

window.registerEmail=async function(){

const email=
document.getElementById("email")
.value.trim();

const password=
document.getElementById("password")
.value;

if(!email||!password){

alert("Nhập email và mật khẩu.");

return;

}

if(password.length<6){

alert("Mật khẩu tối thiểu 6 ký tự.");

return;

}

try{

const result=
await createUserWithEmailAndPassword(
auth,
email,
password
);

await updateProfile(
result.user,
{
displayName:email.split("@")[0]
}
);

await setDoc(
doc(db,"users",result.user.uid),
{
email,
name:email.split("@")[0],
budget:0
},
{merge:true}
);

alert("Tạo tài khoản thành công.");

}catch(e){

alert(e.message);

}

};


/* =====================
   RESET PASSWORD
===================== */

window.resetPassword=async function(){

const email=
document.getElementById("email")
.value.trim();

if(!email){

alert("Nhập email trước.");

return;

}

try{

await sendPasswordResetEmail(
auth,
email
);

alert("Đã gửi email đặt lại mật khẩu.");

}catch(e){

alert(e.message);

}

};


/* =====================
   AUTH
===================== */

onAuthStateChanged(
auth,
async user=>{

currentUser=user;

if(!user){

document.getElementById("loginPage")
.classList.remove("hidden");

document.getElementById("app")
.classList.add("hidden");

document.getElementById("pinScreen")
.classList.add("hidden");

if(unsubscribe){

unsubscribe();
unsubscribe=null;

}

return;

}


document.getElementById("loginPage")
.classList.add("hidden");


document.getElementById("userName")
.textContent=
user.displayName||user.email;


const pin=
localStorage.getItem(
"megumi_pin_"+user.uid
);


if(!pin){

document.getElementById("app")
.classList.remove("hidden");

await loadData();

await createPin();

}else{

document.getElementById("app")
.classList.add("hidden");

document.getElementById("pinScreen")
.classList.remove("hidden");

setTimeout(
()=>document.getElementById("pinInput").focus(),
300
);

}

});


/* =====================
   LOAD DATA
===================== */

async function loadData(){

if(!currentUser)return;


const userRef=
doc(
db,
"users",
currentUser.uid
);

try{

const snap=await getDoc(userRef);

if(snap.exists()){

const data=snap.data();

document.getElementById("budget")
.value=data.budget||0;

}

listenTransactions();

}catch(e){

console.error(e);

alert(
"Không tải được dữ liệu Firebase: "+
e.message
);

}

}


/* =====================
   TRANSACTIONS
===================== */

function listenTransactions(){

if(unsubscribe)
unsubscribe();

const ref=
collection(
db,
"users",
currentUser.uid,
"transactions"
);

const q=
query(
ref,
orderBy("createdAt","desc")
);

unsubscribe=
onSnapshot(
q,
snap=>{

transactions=
snap.docs.map(
d=>({
id:d.id,
...d.data()
})
);

renderTransactions();
updateStats();

},
error=>{

console.error(error);

alert(
"Firestore lỗi: "+error.message
);

});

}


/* =====================
   ADD
===================== */

window.addTransaction=async function(){

if(!currentUser)return;

const type=
document.getElementById("type").value;

const amount=
Number(
document.getElementById("amount").value
);

const category=
document.getElementById("category").value;

const note=
document.getElementById("note").value.trim();


if(!amount||amount<=0){

alert("Nhập số tiền.");

return;

}


try{

await addDoc(
collection(
db,
"users",
currentUser.uid,
"transactions"
),
{
type,
amount,
category,
note,
createdAt:Date.now()
}
);


document.getElementById("amount")
.value="";

document.getElementById("note")
.value="";

}catch(e){

alert(
"Không lưu được: "+e.message
);

}

};


/* =====================
   DELETE
===================== */

window.deleteTransaction=async function(id){

if(!confirm("Xóa giao dịch này?"))
return;

try{

await deleteDoc(
doc(
db,
"users",
currentUser.uid,
"transactions",
id
)
);

}catch(e){

alert(e.message);

}

};


/* =====================
   RENDER
===================== */

window.renderTransactions=function(){

const list=
document.getElementById(
"transactionList"
);

const search=
document.getElementById(
"search"
).value.toLowerCase();

const filter=
document.getElementById(
"filterType"
).value;


const data=
transactions.filter(t=>{

const text=
(
t.category+" "+
(t.note||"")
).toLowerCase();

return (
text.includes(search)&&
(
filter==="all"||
t.type===filter
)
);

});


if(!data.length){

list.innerHTML=
'<p class="small">Chưa có giao dịch.</p>';

return;

}


list.innerHTML=
data.map(t=>{

const date=
new Date(t.createdAt)
.toLocaleString("vi-VN");

const sign=
t.type==="income"?"+":"-";

return `

<div class="transaction">

<div>

<b>${escapeHTML(t.category)}</b>

<div class="small">
${escapeHTML(t.note||"")}
</div>

<div class="small">
${date}
</div>

</div>

<div style="text-align:right">

<b class="${t.type}">
${sign}${money(t.amount)}
</b>

<br>

<button
class="danger"
onclick="deleteTransaction('${t.id}')">
Xóa
</button>

</div>

</div>

`;

}).join("");

};


/* =====================
   STATS
===================== */

function updateStats(){

let income=0;
let expense=0;

transactions.forEach(t=>{

if(t.type==="income")
income+=Number(t.amount);

else
expense+=Number(t.amount);

});


document.getElementById("income")
.textContent=money(income);

document.getElementById("expense")
.textContent=money(expense);

document.getElementById("balance")
.textContent=
money(income-expense);

updateBudgetText(expense);

}


/* =====================
   SAVE BUDGET
===================== */

window.saveBudget=async function(){

if(!currentUser){

alert("Bạn chưa đăng nhập.");

return;

}


const budget=
Number(
document.getElementById("budget")
.value
);


if(budget<0){

alert("Ngân sách không hợp lệ.");

return;

}


try{

await setDoc(
doc(
db,
"users",
currentUser.uid
),
{
budget:budget,
email:currentUser.email,
name:
currentUser.displayName||
currentUser.email
},
{merge:true}
);


alert("✅ Đã lưu ngân sách.");

updateBudgetText(
transactions
.filter(t=>t.type==="expense")
.reduce(
(a,b)=>a+Number(b.amount),
0
)
);

}catch(e){

console.error(e);

alert(
"❌ Lưu thất bại:\n"+e.message
);

}

};


/* =====================
   BUDGET TEXT
===================== */

function updateBudgetText(expense){

const budget=
Number(
document.getElementById("budget")
.value||0
);

const el=
document.getElementById("budgetText");

if(!budget){

el.textContent="Chưa đặt ngân sách.";

return;

}

const remain=budget-expense;

el.textContent=
remain>=0
?`Còn lại: ${money(remain)}`
:`Đã vượt: ${money(Math.abs(remain))}`;

}


/* =====================
   CSV
===================== */

window.exportCSV=function(){

if(!transactions.length){

alert("Chưa có dữ liệu.");

return;

}

let csv=
"Loại,Danh mục,Số tiền,Ghi chú,Ngày\n";


transactions.forEach(t=>{

csv+=
`"${t.type}","${t.category}","${t.amount}","${(t.note||"").replaceAll('"','""')}","${new Date(t.createdAt).toLocaleString("vi-VN")}"\n`;

});


const blob=
new Blob(
["\ufeff"+csv],
{type:"text/csv;charset=utf-8"}
);

const url=
URL.createObjectURL(blob);

const a=
document.createElement("a");

a.href=url;
a.download="megumi-chi-tieu.csv";
a.click();

URL.revokeObjectURL(url);

};


/* =====================
   DARK
===================== */

window.toggleDark=function(){

document.body.classList.toggle("dark");

localStorage.setItem(
"megumi_dark",
document.body.classList.contains("dark")
?"1":"0"
);

};


if(
localStorage.getItem("megumi_dark")==="1"
){

document.body.classList.add("dark");

}


/* =====================
   LOGOUT
===================== */

window.logout=async function(){

if(!confirm("Đăng xuất?"))
return;

if(unsubscribe){

unsubscribe();
unsubscribe=null;

}

await signOut(auth);

};

</script>

</body>
</html>
