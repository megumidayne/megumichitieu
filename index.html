
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Megumi Chi Tiêu</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --pink:#ff70a3;
    --pink2:#ff9abb;
    --purple:#8064d9;
    --green:#16a36a;
    --red:#ef5575;
    --bg:#f7f7fb;
    --text:#292936;
    --muted:#888;
    --white:#fff;
    --border:#eeeeF3;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}

/* HEADER */

header{
    background:linear-gradient(135deg,var(--pink),var(--pink2));
    color:white;
    padding:28px 16px;
    text-align:center;
}

header h1{
    font-size:30px;
    margin-bottom:7px;
}

header p{
    opacity:.9;
}

/* CONTAINER */

.container{
    width:min(1000px,100%);
    margin:25px auto;
    padding:0 15px;
}

/* CARD */

.card{
    background:white;
    border-radius:20px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
}

/* LOGIN */

.login-card{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.user-area{
    display:flex;
    align-items:center;
    gap:12px;
}

.user-photo{
    width:45px;
    height:45px;
    border-radius:50%;
    display:none;
}

.user-name{
    font-weight:bold;
}

.user-email{
    color:var(--muted);
    font-size:13px;
    margin-top:4px;
}

.login-btn,
.logout-btn{
    width:auto;
    margin:0;
    padding:11px 17px;
}

.login-btn{
    background:white;
    color:#333;
    border:1px solid #ddd;
}

.logout-btn{
    background:#777;
}

/* SUMMARY */

.summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.summary .card{
    text-align:center;
}

.summary h3{
    color:var(--muted);
    font-size:14px;
    margin-bottom:10px;
}

.amount{
    font-size:23px;
    font-weight:bold;
}

.income{
    color:var(--green);
}

.expense{
    color:var(--red);
}

.balance{
    color:var(--purple);
}

/* FORM */

h2{
    font-size:20px;
    margin-bottom:15px;
}

input,
select,
button{
    width:100%;
    padding:13px;
    border-radius:11px;
    font-size:15px;
}

input,
select{
    border:1px solid #ddd;
    background:white;
    outline:none;
    margin-top:10px;
}

input:focus,
select:focus{
    border-color:var(--pink);
}

button{
    border:none;
    background:var(--pink);
    color:white;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

button:hover{
    opacity:.9;
}

/* FORM GRID */

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

/* SEARCH */

.search-row{
    display:grid;
    grid-template-columns:1fr 180px;
    gap:10px;
}

/* TRANSACTION */

.transaction{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    padding:15px 0;
    border-bottom:1px solid var(--border);
}

.transaction:last-child{
    border-bottom:none;
}

.transaction-left{
    min-width:0;
}

.transaction-name{
    font-weight:bold;
    margin-bottom:5px;
    word-break:break-word;
}

.transaction-info{
    color:var(--muted);
    font-size:13px;
}

.transaction-right{
    text-align:right;
    white-space:nowrap;
}

.transaction-amount{
    font-weight:bold;
}

.delete-btn{
    width:auto;
    background:#ff5757;
    padding:7px 11px;
    margin-top:7px;
    font-size:12px;
}

.empty{
    text-align:center;
    color:#999;
    padding:25px 10px;
}

/* STATUS */

.status{
    text-align:center;
    color:#888;
    font-size:13px;
    margin-bottom:15px;
}

.loading{
    opacity:.7;
}

/* MOBILE */

@media(max-width:700px){

    header h1{
        font-size:25px;
    }

    .summary{
        grid-template-columns:1fr;
        gap:0;
    }

    .login-card{
        flex-direction:column;
        align-items:stretch;
    }

    .login-btn,
    .logout-btn{
        width:100%;
    }

    .form-grid{
        grid-template-columns:1fr;
        gap:0;
    }

    .search-row{
        grid-template-columns:1fr;
    }

    .transaction{
        align-items:flex-start;
    }

    .transaction-right{
        max-width:45%;
    }
}
</style>
</head>

<body>

<header>
    <h1>🌸 Megumi Chi Tiêu</h1>
    <p>Quản lý chi tiêu cá nhân</p>
</header>

<div class="container">

    <!-- LOGIN -->

    <div class="card login-card">

        <div id="loginArea">

            <h2>🔐 Megumi Chi Tiêu</h2>

            <div class="user-email">
                Đăng nhập để lưu và đồng bộ dữ liệu.
            </div>

        </div>

        <button
            id="googleLogin"
            class="login-btn"
        >
            🔵 Đăng nhập bằng Google
        </button>

        <div
            id="userArea"
            class="user-area"
            style="display:none;"
        >

            <img
                id="userPhoto"
                class="user-photo"
                alt="Ảnh đại diện"
            >

            <div>
                <div
                    id="userName"
                    class="user-name"
                ></div>

                <div
                    id="userEmail"
                    class="user-email"
                ></div>
            </div>

            <button
                id="logoutBtn"
                class="logout-btn"
            >
                Đăng xuất
            </button>

        </div>

    </div>


    <div
        id="status"
        class="status"
    >
        Chưa đăng nhập
    </div>


    <!-- SUMMARY -->

    <div class="summary">

        <div class="card">

            <h3>💰 Tổng thu</h3>

            <div
                id="totalIncome"
                class="amount income"
            >
                0 ₫
            </div>

        </div>


        <div class="card">

            <h3>💸 Tổng chi</h3>

            <div
                id="totalExpense"
                class="amount expense"
            >
                0 ₫
            </div>

        </div>


        <div class="card">

            <h3>💵 Số dư</h3>

            <div
                id="balance"
                class="amount balance"
            >
                0 ₫
            </div>

        </div>

    </div>


    <!-- ADD -->

    <div class="card">

        <h2>➕ Thêm giao dịch</h2>

        <input
            id="name"
            type="text"
            placeholder="Tên giao dịch, VD: Ăn sáng"
        >


        <div class="form-grid">

            <input
                id="money"
                type="number"
                min="0"
                step="1"
                placeholder="Số tiền"
            >


            <input
                id="date"
                type="date"
            >

        </div>


        <div class="form-grid">

            <select id="type">

                <option value="expense">
                    💸 Khoản chi
                </option>

                <option value="income">
                    💰 Khoản thu
                </option>

            </select>


            <select id="category">

                <option value="🍜 Ăn uống">
                    🍜 Ăn uống
                </option>

                <option value="🚗 Đi lại">
                    🚗 Đi lại
                </option>

                <option value="🛍️ Mua sắm">
                    🛍️ Mua sắm
                </option>

                <option value="📚 Học tập">
                    📚 Học tập
                </option>

                <option value="🏠 Nhà ở">
                    🏠 Nhà ở
                </option>

                <option value="🎮 Giải trí">
                    🎮 Giải trí
                </option>

                <option value="💼 Công việc">
                    💼 Công việc
                </option>

                <option value="📦 Khác">
                    📦 Khác
                </option>

            </select>

        </div>


        <button id="addBtn">
            ➕ Thêm giao dịch
        </button>

    </div>


    <!-- SEARCH -->

    <div class="card">

        <h2>🔎 Tìm kiếm</h2>

        <div class="search-row">

            <input
                id="search"
                type="text"
                placeholder="Tìm giao dịch..."
            >

            <select id="filterType">

                <option value="all">
                    Tất cả
                </option>

                <option value="income">
                    💰 Khoản thu
                </option>

                <option value="expense">
                    💸 Khoản chi
                </option>

            </select>

        </div>

    </div>


    <!-- HISTORY -->

    <div class="card">

        <h2>📋 Lịch sử giao dịch</h2>

        <div id="transactionList">

            <div class="empty">
                Hãy đăng nhập để xem giao dịch.
            </div>

        </div>

    </div>

</div>


<!-- FIREBASE -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
    getFirestore,
    collection,
    addDoc,
    deleteDoc,
    doc,
    query,
    orderBy,
    onSnapshot,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

    apiKey:
        "AIzaSyA75Nfy9Ti_z1aWiVk7E4UsmRmgThTVv3Q",

    authDomain:
        "megumi-chi-tieu.firebaseapp.com",

    projectId:
        "megumi-chi-tieu",

    storageBucket:
        "megumi-chi-tieu.firebasestorage.app",

    messagingSenderId:
        "570579728873",

    appId:
        "1:570579728873:web:490687c1c7c415061af378",

    measurementId:
        "G-F6M79HB9K3"
};


/* START FIREBASE */

const app =
    initializeApp(firebaseConfig);


/* AUTH */

const auth =
    getAuth(app);


const provider =
    new GoogleAuthProvider();


/* FIRESTORE */

const db =
    getFirestore(app);


/* ELEMENTS */

const googleLogin =
    document.getElementById(
        "googleLogin"
    );

const logoutBtn =
    document.getElementById(
        "logoutBtn"
    );

const userArea =
    document.getElementById(
        "userArea"
    );

const userPhoto =
    document.getElementById(
        "userPhoto"
    );

const userName =
    document.getElementById(
        "userName"
    );

const userEmail =
    document.getElementById(
        "userEmail"
    );

const status =
    document.getElementById(
        "status"
    );

const list =
    document.getElementById(
        "transactionList"
    );


let currentUser = null;

let unsubscribeTransactions = null;

let transactions = [];


/* GOOGLE LOGIN */

googleLogin.addEventListener(
    "click",
    async () => {

        try {

            googleLogin.disabled = true;

            googleLogin.textContent =
                "Đang đăng nhập...";

            await signInWithPopup(
                auth,
                provider
            );

        } catch(error) {

            console.error(error);

            alert(
                "Không thể đăng nhập Google.\n\n" +
                error.message
            );

        } finally {

            googleLogin.disabled = false;

            googleLogin.textContent =
                "🔵 Đăng nhập bằng Google";

        }

    }
);


/* LOGOUT */

logoutBtn.addEventListener(
    "click",
    async () => {

        await signOut(auth);

    }
);


/* AUTH STATE */

onAuthStateChanged(
    auth,
    user => {

        currentUser = user;


        if(user){

            googleLogin.style.display =
                "none";

            userArea.style.display =
                "flex";


            userName.textContent =
                user.displayName ||
                "Người dùng";


            userEmail.textContent =
                user.email || "";


            if(user.photoURL){

                userPhoto.src =
                    user.photoURL;

                userPhoto.style.display =
                    "block";

            }


            status.textContent =
                "☁️ Đã đăng nhập — dữ liệu được lưu trên Firebase";


            loadTransactions();

        }else{

            googleLogin.style.display =
                "block";

            userArea.style.display =
                "none";


            userPhoto.style.display =
                "none";


            status.textContent =
                "🔐 Hãy đăng nhập để sử dụng";


            transactions = [];

            if(unsubscribeTransactions){

                unsubscribeTransactions();

                unsubscribeTransactions =
                    null;

            }


            renderTransactions();

        }

    }
);


/* LOAD DATA */

function loadTransactions(){

    if(!currentUser)
        return;


    if(unsubscribeTransactions){

        unsubscribeTransactions();

    }


    const transactionsRef =
        collection(
            db,
            "users",
            currentUser.uid,
            "transactions"
        );


    const q =
        query(
            transactionsRef,
            orderBy(
                "createdAt",
                "desc"
            )
        );


    unsubscribeTransactions =
        onSnapshot(
            q,
            snapshot => {

                transactions =
                    snapshot.docs.map(
                        item => ({

                            id:item.id,

                            ...item.data()

                        })
                    );


                renderTransactions();

            },

            error => {

                console.error(error);

                list.innerHTML =
                    `
                    <div class="empty">
                        Không thể tải dữ liệu.
                        <br>
                        Hãy kiểm tra Firestore Rules.
                    </div>
                    `;

            }
        );

}


/* ADD TRANSACTION */

document
.getElementById("addBtn")
.addEventListener(
    "click",
    async () => {

        if(!currentUser){

            alert(
                "Bạn cần đăng nhập Google trước!"
            );

            return;

        }


        const name =
            document
            .getElementById("name")
            .value
            .trim();


        const money =
            Number(
                document
                .getElementById("money")
                .value
            );


        const type =
            document
            .getElementById("type")
            .value;


        const category =
            document
            .getElementById("category")
            .value;


        const date =
            document
            .getElementById("date")
            .value;


        if(
            !name ||
            !money ||
            money <= 0
        ){

            alert(
                "Vui lòng nhập tên và số tiền!"
            );

            return;

        }


        try{

            const transactionsRef =
                collection(
                    db,
                    "users",
                    currentUser.uid,
                    "transactions"
                );


            await addDoc(
                transactionsRef,
                {

                    name:name,

                    money:money,

                    type:type,

                    category:category,

                    date:
                        date ||
                        new Date()
                        .toISOString()
                        .slice(0,10),

                    createdAt:
                        serverTimestamp()

                }
            );


            document
            .getElementById("name")
            .value = "";


            document
            .getElementById("money")
            .value = "";


            status.textContent =
                "✅ Đã lưu giao dịch";

        }catch(error){

            console.error(error);

            alert(
                "Không thể lưu giao dịch.\n\n" +
                error.message
            );

        }

    }
);


/* DELETE */

async function deleteTransaction(id){

    if(!currentUser)
        return;


    const ok =
        confirm(
            "Bạn có chắc muốn xóa giao dịch này?"
        );


    if(!ok)
        return;


    try{

        await deleteDoc(

            doc(
                db,
                "users",
                currentUser.uid,
                "transactions",
                id
            )

        );

    }catch(error){

        console.error(error);

        alert(
            "Không thể xóa giao dịch."
        );

    }

}


/* MAKE DELETE AVAILABLE */

window.deleteTransaction =
    deleteTransaction;


/* RENDER */

function renderTransactions(){

    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();


    const filterType =
        document
        .getElementById("filterType")
        .value;


    let filtered =
        transactions.filter(
            item => {

                const matchesSearch =

                    String(
                        item.name || ""
                    )
                    .toLowerCase()
                    .includes(search)

                    ||

                    String(
                        item.category || ""
                    )
                    .toLowerCase()
                    .includes(search);


                const matchesType =

                    filterType === "all"

                    ||

                    item.type === filterType;


                return (
                    matchesSearch &&
                    matchesType
                );

            }
        );


    let totalIncome = 0;

    let totalExpense = 0;


    transactions.forEach(
        item => {

            if(
                item.type === "income"
            ){

                totalIncome +=
                    Number(item.money || 0);

            }else{

                totalExpense +=
                    Number(item.money || 0);

            }

        }
    );


    const balance =
        totalIncome -
        totalExpense;


    document
    .getElementById(
        "totalIncome"
    )
    .textContent =
        formatMoney(
            totalIncome
        );


    document
    .getElementById(
        "totalExpense"
    )
    .textContent =
        formatMoney(
            totalExpense
        );


    document
    .getElementById(
        "balance"
    )
    .textContent =
        formatMoney(
            balance
        );


    if(
        filtered.length === 0
    ){

        list.innerHTML =
            `
            <div class="empty">
                Chưa có giao dịch.
            </div>
            `;

        return;

    }


    list.innerHTML = "";


    filtered.forEach(
        item => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "transaction";


            const isIncome =
                item.type === "income";


            const sign =
                isIncome
                ? "+"
                : "-";


            const color =
                isIncome
                ? "var(--green)"
                : "var(--red)";


            div.innerHTML = `

                <div
                    class="transaction-left"
                >

                    <div
                        class="transaction-name"
                    >
                        ${escapeHTML(
                            item.name || ""
                        )}
                    </div>

                    <div
                        class="transaction-info"
                    >
                        ${escapeHTML(
                            item.category || ""
                        )}
                        •
                        ${item.date || ""}
                    </div>

                </div>


                <div
                    class="transaction-right"
                >

                    <div
                        class="transaction-amount"
                        style="color:${color}"
                    >
                        ${sign}${formatMoney(
                            item.money || 0
                        )}
                    </div>


                    <button
                        class="delete-btn"
                        onclick="deleteTransaction('${item.id}')"
                    >
                        Xóa
                    </button>

                </div>

            `;


            list.appendChild(div);

        }
    );

}


/* FORMAT MONEY */

function formatMoney(number){

    return Number(number)
        .toLocaleString("vi-VN")
        + " ₫";

}


/* ESCAPE HTML */

function escapeHTML(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* SEARCH */

document
.getElementById("search")
.addEventListener(
    "input",
    renderTransactions
);


document
.getElementById("filterType")
.addEventListener(
    "change",
    renderTransactions
);


/* DEFAULT DATE */

document
.getElementById("date")
.value =
    new Date()
    .toISOString()
    .slice(0,10);


/* INITIAL */

renderTransactions();

</script>

</body>
</html>
